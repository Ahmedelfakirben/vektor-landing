<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1E"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="2.5"/>

  <!-- Inner subtle grid accent -->
  <line x1="24" y1="46" x2="96" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  <circle cx="28" cy="32" r="3" fill="#EF4444" opacity="0.8"/>
  <circle cx="38" cy="32" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="48" cy="32" r="3" fill="#10B981" opacity="0.8"/>

  <!-- Globe / Web wireframe -->
  <g filter="url(#shadowFilter)">
    <!-- Browser window outline -->
    <rect x="20" y="22" width="80" height="74" rx="12" fill="none" stroke="url(#primaryGlow)" stroke-width="3"/>
    
    <!-- Code brackets & slash -->
    <path d="M 46 58 L 38 66 L 46 74" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 74 58 L 82 66 L 74 74" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 64 54 L 56 78" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Small corner badge "800 DH" glow -->
  <g transform="translate(68, 78)">
    <rect x="0" y="0" width="46" height="20" rx="10" fill="#0F172A" stroke="#7BE099" stroke-width="1.8"/>
    <text x="23" y="14" fill="#7BE099" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">800 DH</text>
  </g>
</svg>
